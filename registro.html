<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema NUTRI DRRY - Registro de Nutriólogo</title>
  <meta name="description" content="Registro de nueva cuenta profesional en Sistema NUTRI DRRY">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <div class="auth-badge">
        <svg viewBox="0 0 24 24">
          <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
        </svg>
        Nuevo Registro
      </div>
      <h1 class="auth-title">Sistema <span>NUTRI DRRY</span></h1>
      <p class="auth-subtitle">Crea tu cuenta profesional para gestionar expedientes clínicos y consultas</p>
    </div>

    <!-- Alertas de estado -->
    <div id="alertBox" class="alert-box"></div>

    <form id="registerForm" autocomplete="off">
      <div class="form-group">
        <label for="fullName" class="form-label">NOMBRE COMPLETO</label>
        <div class="input-wrapper">
          <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          <input 
            type="text" 
            id="fullName" 
            class="form-input" 
            placeholder="Ej. Rolando Yhair" 
            required
            autofocus
          >
        </div>
      </div>

      <div class="form-group">
        <label for="username" class="form-label">USUARIO DE ACCESO</label>
        <div class="input-wrapper">
          <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <input 
            type="text" 
            id="username" 
            class="form-input" 
            placeholder="Ej. rolando" 
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">CONTRASEÑA</label>
        <div class="input-wrapper">
          <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="Mínimo 4 caracteres" 
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword" class="form-label">CONFIRMAR CONTRASEÑA</label>
        <div class="input-wrapper">
          <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
          <input 
            type="password" 
            id="confirmPassword" 
            class="form-input" 
            placeholder="Repite la contraseña" 
            required
          >
        </div>
      </div>

      <button type="submit" id="btnRegister" class="btn-submit">
        <span>Crear Cuenta</span>
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
      </button>
    </form>

    <div class="auth-footer">
      ¿Ya tienes una cuenta registrada? 
      <a href="index.html" class="auth-link">Inicia sesión</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
