<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema NUTRI DRRY - Inicio de Sesión</title>
  <meta name="description" content="Acceso al panel clínico y control nutricional de Sistema NUTRI DRRY">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <div class="auth-badge">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
        </svg>
        Plataforma Clínica
      </div>
      <h1 class="auth-title">Sistema <span>NUTRI DRRY</span></h1>
      <p class="auth-subtitle">Ingresa tus credenciales para acceder al control de pacientes y consultas</p>
    </div>

    <!-- Alertas de estado -->
    <div id="alertBox" class="alert-box"></div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="username" class="form-label">USUARIO</label>
        <div class="input-wrapper">
          <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          <input 
            type="text" 
            id="username" 
            class="form-input" 
            placeholder="Ej. Rolando Yhair" 
            required
            autofocus
          >
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">CONTRASEÑA</label>
        <div class="input-wrapper">
          <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="••••••••" 
            required
          >
        </div>
      </div>

      <button type="submit" id="btnLogin" class="btn-submit">
        <span>Entrar al Sistema</span>
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" />
        </svg>
      </button>
    </form>

    <div class="auth-footer">
      ¿No tienes una cuenta de nutriólogo? 
      <a href="registro.html" class="auth-link">Regístrate aquí</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
